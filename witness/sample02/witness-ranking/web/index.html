<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Witness Ranking</title>
  <link rel="icon" href="favicon_ranking.ico" id="favicon">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>


  <style>
    body {
      font-family: Meiryo, sans-serif;

      margin: 0;

      background: #f5f6f8;
    }


    /*
     * 上部コントロール
     */
    #menu {

      position: sticky;

      top: 0;

      z-index: 100;

      background: rgba(255, 255, 255, 0.96);

      border-bottom: 1px solid #ddd;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);

      padding: 12px 18px;

    }


    /*
     * 1行
     */
    .menu-row {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 8px;

    }


    .menu-row:last-child {

      margin-bottom: 0;

    }


    /*
     * DISPLAY / PERIOD
     */
    .menu-title {

      width: 75px;

      font-size: 12px;

      font-weight: bold;

      letter-spacing: 1px;

      color: #777;

      text-transform: uppercase;

    }


    /*
     * ボタングループ
     */
    .button-group {

      display: inline-flex;

      padding: 3px;

      border-radius: 8px;

      background: #eef0f3;

      gap: 2px;

    }


    /*
     * ボタン
     */
    button {

      border: none;

      background: transparent;

      border-radius: 6px;

      padding: 6px 15px;

      margin: 0;

      font-family: inherit;

      font-size: 14px;

      cursor: pointer;

      color: #555;

      transition:
        background 0.15s,
        color 0.15s,
        transform 0.1s,
        box-shadow 0.15s;

    }


    /*
     * マウスを乗せた時
     */
    button:hover {

      background: rgba(255, 255, 255, 0.8);

      color: #111;

    }


    /*
     * クリック時
     */
    button:active {

      transform: scale(0.96);

    }


    /*
     * 選択中
     */
    button.active {

      background: #ffffff;

      color: #111;

      font-weight: bold;

      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.18);

    }


    /*
     * Chart
     */
    #chart-area {

      position: relative;

      width: 100%;

      background: white;

    }


    /*
     * 小さい画面
     */
    @media screen and (max-width: 600px) {

      #menu {

        padding: 10px;

      }


      .menu-row {

        align-items: flex-start;

        gap: 8px;

      }


      .menu-title {

        width: 60px;

        padding-top: 7px;

        flex-shrink: 0;

      }


      .button-group {

        flex-wrap: wrap;

      }


      button {

        padding: 6px 11px;

      }

    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      line-height: 1.35;
      font-size: 14px;
      font-weight: 600;
      margin: 2px 0;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      display: inline-block;
      border-radius: 2px;
      box-sizing: border-box;
    }
  </style>

</head>


<body>


  <div id="menu">


    <!-- 表示件数 -->

    <div class="menu-row">

      <span class="menu-title">
        DISPLAY
      </span>


      <div class="button-group">

        <button class="limit-button" data-limit="21">
          21
        </button>


        <button class="limit-button" data-limit="50">
          50
        </button>


        <button class="limit-button" data-limit="100">
          100
        </button>


        <button class="limit-button" data-limit="300">
          300
        </button>

      </div>

    </div>



    <!-- 期間 -->

    <div class="menu-row">

      <span class="menu-title">
        PERIOD
      </span>


      <div class="button-group">

        <button class="span-button" data-span="hour">
          1時間
        </button>


        <button class="span-button" data-span="day">
          1日
        </button>


        <button class="span-button" data-span="week">
          1週間
        </button>


        <button class="span-button" data-span="month">
          1ヶ月
        </button>


        <button class="span-button" data-span="year">
          1年
        </button>

      </div>

    </div>


  </div>



  <div id="chart-area">

    <canvas id="myChart"></canvas>

  </div>



  <script>


    /*
     * URLパラメータ取得
     *
     * 例
     *
     * ?limit=100&span=week
     */
    const params =
      new URLSearchParams(
        window.location.search
      );



    /*
     * 表示可能な件数
     */
    const allowedLimits = [
      21,
      50,
      100,
      300
    ];



    /*
     * 表示可能な期間
     */
    const allowedSpans = [
      "hour",
      "day",
      "week",
      "month",
      "year"
    ];



    /*
     * limit
     */
    let limit =
      Number(
        params.get("limit")
      );


    if (
      !allowedLimits.includes(limit)
    ) {
      limit = 21;
    }



    /*
     * span
     */
    let span =
      params.get("span");


    if (
      !allowedSpans.includes(span)
    ) {
      span = "hour";
    }



    /*
     * ranking.jsが使用
     */
    let user =
      params.get("user")
      ||
      "";


    /*
     * detail.htmlへ渡す値
     */
    let hours = span;



    /*
     * Chart作成後
     */
    function afterMakeChart(len) {

      console.log(
        "chart rows:",
        len
      );

    }



    /*
     * 現在の状態をURLへ反映
     */
    function updateURL() {

      const url =
        new URL(
          window.location.href
        );


      url.searchParams.set(
        "limit",
        limit
      );


      url.searchParams.set(
        "span",
        span
      );


      history.replaceState(
        null,
        "",
        url.toString()
      );

    }



    /*
     * ボタンの選択状態を更新
     */
    function updateButtons() {


      document
        .querySelectorAll(
          ".limit-button"
        )
        .forEach(
          button => {


            button.classList.toggle(

              "active",

              Number(
                button.dataset.limit
              )

              ===

              limit

            );


          }
        );



      document
        .querySelectorAll(
          ".span-button"
        )
        .forEach(
          button => {


            button.classList.toggle(

              "active",

              button.dataset.span
              ===
              span

            );


          }
        );


    }



    /*
     * 表示件数ボタン
     */
    document
      .querySelectorAll(
        ".limit-button"
      )
      .forEach(
        button => {


          button.addEventListener(

            "click",

            () => {


              limit = Number(
                button.dataset.limit
              );


              updateURL();

              updateButtons();

              loadRanking();


            }

          );


        }
      );



    /*
     * 期間ボタン
     */
    document
      .querySelectorAll(
        ".span-button"
      )
      .forEach(
        button => {


          button.addEventListener(

            "click",

            () => {


              span =
                button.dataset.span;


              hours =
                span;


              updateURL();

              updateButtons();

              loadRanking();


            }

          );


        }
      );


  </script>



  <script src="./ranking.js"></script>

  <script src="./csvread2.js"></script>



  <script>


    /*
     * 選択された期間の
     * CSVを読み込む
     *
     * ranking_hour.csv
     * ranking_day.csv
     * ranking_week.csv
     * ranking_month.csv
     * ranking_year.csv
     */
    function loadRanking() {

      csvread(
        "ranking_" + span
      );

    }



    /*
     * 最初の表示
     */
    updateURL();

    updateButtons();

    loadRanking();


  </script>
